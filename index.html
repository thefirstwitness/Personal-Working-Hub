<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root,[data-theme="light"]{
    --bg:#EAE7DF;--col-bg:#F0EDE6;--panel:#FFFFFF;--border:#E5E1D8;
    --text:#1F1F1F;--muted:#8A867E;
    --primary:#1F1F1F;--primary-hover:#3A3A3A;
    --hover-bg:#F5F3ED;--chip-bg:#F0EDE6;--count-bg:#DCD8CF;
    --shadow:rgba(40,35,30,.06);--shadow-hover:rgba(40,35,30,.14);
    --on-primary:#FFFFFF;--focus-ring:rgba(31,31,31,.12);
    --today-mark:#D4A864;
    --sidebar-bg:#1F1F1F;--sidebar-text:#E8E5DE;--sidebar-muted:#7A7A7A;
    --sidebar-hover:#2A2A2A;--sidebar-border:#2A2A2A;
    --sidebar-active-bg:#F5F3ED;--sidebar-active-text:#1F1F1F;
    --tag-high-bg:#F7E6E2;--tag-high-fg:#B87B72;
    --tag-normal-bg:#E6EAF7;--tag-normal-fg:#7787B5;
    --tag-low-bg:#E4EDE2;--tag-low-fg:#7B9A7F;
    --status-soon-bg:#F8EDD5;--status-soon-fg:#B8924D;
    --status-long-bg:#E6EAF7;--status-long-fg:#7787B5;
    --status-overdue-bg:#F7E6E2;--status-overdue-fg:#B87B72;
    --today-bg:#F8EDD5;--today-fg:#B8924D;
    --remind-bg:#E6EAF7;--remind-fg:#7787B5;
  }
  [data-theme="dark"]{
    --bg:#2B2A28;--col-bg:#323130;--panel:#3A3836;--border:#494643;
    --text:#DDD9D3;--muted:#8A8580;
    --primary:#A0AEC0;--primary-hover:#B8C4D0;
    --hover-bg:#3D3B39;--chip-bg:#3D3B39;--count-bg:#4A4744;
    --shadow:rgba(0,0,0,.25);--shadow-hover:rgba(0,0,0,.45);
    --on-primary:#2B2A28;--focus-ring:rgba(160,174,192,.2);
    --today-mark:#D4B586;
    --sidebar-bg:#262523;--sidebar-text:#DDD9D3;--sidebar-muted:#8A8580;
    --sidebar-hover:#3D3B39;--sidebar-border:#35332F;
    --sidebar-active-bg:#A0AEC0;--sidebar-active-text:#1F1F1F;
    --tag-high-bg:#4A3E3D;--tag-high-fg:#D5A8A3;
    --tag-normal-bg:#3D454D;--tag-normal-fg:#A8BFD3;
    --tag-low-bg:#3D4540;--tag-low-fg:#A8BFA8;
    --status-soon-bg:#4A4235;--status-soon-fg:#D4B586;
    --status-long-bg:#3D454D;--status-long-fg:#A8BFD3;
    --status-overdue-bg:#4A3E3D;--status-overdue-fg:#D5A8A3;
    --today-bg:#4A4235;--today-fg:#D4B586;
    --remind-bg:#3D454D;--remind-fg:#A8BFD3;
  }
  [data-theme="matcha"]{
    --bg:#3A4239;--col-bg:#454D44;--panel:#4E564D;--border:#5C6359;
    --text:#E3E6DD;--muted:#959D8F;
    --primary:#A8B5A2;--primary-hover:#BBC7B6;
    --hover-bg:#525A50;--chip-bg:#525A50;--count-bg:#5C6359;
    --shadow:rgba(0,0,0,.25);--shadow-hover:rgba(0,0,0,.45);
    --on-primary:#2E352C;--focus-ring:rgba(168,181,162,.22);
    --today-mark:#D4B586;
    --sidebar-bg:#343B32;--sidebar-text:#E3E6DD;--sidebar-muted:#959D8F;
    --sidebar-hover:#525A50;--sidebar-border:#485049;
    --sidebar-active-bg:#A8B5A2;--sidebar-active-text:#1F1F1F;
    --tag-high-bg:#4A3E3D;--tag-high-fg:#D5A8A3;
    --tag-normal-bg:#3F4A50;--tag-normal-fg:#A8BFD3;
    --tag-low-bg:#4A5449;--tag-low-fg:#B8C7B3;
    --status-soon-bg:#4A4235;--status-soon-fg:#D4B586;
    --status-long-bg:#3F4A50;--status-long-fg:#A8BFD3;
    --status-overdue-bg:#4A3E3D;--status-overdue-fg:#D5A8A3;
    --today-bg:#4A4235;--today-fg:#D4B586;
    --remind-bg:#3F4A50;--remind-fg:#A8BFD3;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);height:100vh;
    display:flex;overflow:hidden;transition:background .3s,color .3s;
  }
  .app-layout{display:flex;width:100%;height:100vh;}

  .sidebar{
    flex:0 0 210px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sidebar-header{
    display:flex;align-items:flex-start;gap:4px;
    padding:18px 14px 16px 18px;
    border-bottom:1px solid var(--sidebar-border);
  }
  .sidebar-title-group{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .sidebar-title{
    font-size:15px;font-weight:600;color:var(--sidebar-text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    cursor:pointer;transition:color .15s;
  }
  .sidebar-title:hover{color:#FFFFFF;}
  .sidebar-signature{
    font-size:11px;color:var(--sidebar-muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    cursor:pointer;line-height:1.4;transition:color .15s;
  }
  .sidebar-signature:hover{color:var(--sidebar-text);}
  .sidebar-signature.empty{font-style:italic;opacity:.75;}
  .edit-title-btn{
    width:24px;height:24px;flex:0 0 24px;border:none;background:transparent;
    color:var(--sidebar-muted);font-size:13px;cursor:pointer;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s,background .15s,color .15s;
  }
  .sidebar-header:hover .edit-title-btn{opacity:1;}
  .edit-title-btn:hover{background:var(--sidebar-hover);color:var(--sidebar-text);}
  .sidebar-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .sidebar-nav::-webkit-scrollbar{width:5px;}
  .sidebar-nav::-webkit-scrollbar-thumb{background:var(--sidebar-hover);border-radius:3px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;
    border:none;background:transparent;color:var(--sidebar-muted);font-size:13.5px;
    cursor:pointer;border-radius:8px;text-align:left;
    transition:background .15s,color .15s;font-family:inherit;width:100%;
  }
  .nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text);}
  .nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);font-weight:500;}
  .nav-item .icon{font-size:15px;}
  .nav-item .badge{
    margin-left:auto;font-size:11px;font-weight:500;
    background:var(--sidebar-hover);color:var(--sidebar-muted);
    padding:1px 7px;border-radius:99px;min-width:18px;text-align:center;
  }
  .nav-item.active .badge{background:rgba(0,0,0,.1);color:var(--sidebar-active-text);}
  .nav-divider{height:1px;background:var(--sidebar-border);margin:8px 6px;}

  .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
  .top-bar{
    display:flex;align-items:center;gap:10px;padding:12px 24px;
    background:var(--bg);border-bottom:1px solid var(--border);
    flex-wrap:wrap;flex:0 0 auto;
  }
  #search-input{
    flex:1;min-width:140px;max-width:260px;padding:9px 14px;
    border:1px solid transparent;border-radius:10px;font-size:13px;
    outline:none;background:var(--panel);color:var(--text);
    box-shadow:0 1px 2px var(--shadow);
    transition:border-color .15s,box-shadow .15s;
  }
  #search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring);}
  #search-input::placeholder{color:var(--muted);}
  #priority-filter{
    padding:9px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--text);font-size:13px;outline:none;cursor:pointer;
  }
  .icon-btn{
    width:36px;height:36px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--text);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .15s;flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--hover-bg);}
  .icon-btn:active{transform:scale(.95);}
  .archive-btn{
    display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;
    border:1px solid var(--border);border-radius:10px;background:var(--panel);
    color:var(--text);font-size:13px;cursor:pointer;flex:0 0 auto;
  }
  .archive-btn:hover{background:var(--hover-bg);}
  .archive-btn .count{
    font-size:11px;font-weight:500;background:var(--chip-bg);color:var(--muted);
    padding:1px 7px;border-radius:99px;min-width:18px;text-align:center;
  }
  .view-switch{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .view-btn{
    padding:8px 16px;border:none;background:var(--panel);font-size:13px;
    color:var(--muted);cursor:pointer;transition:all .15s;
  }
  .view-btn:hover{background:var(--hover-bg);}
  .view-btn.active{background:var(--primary);color:var(--on-primary);}
  .user-btn{
    display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;
    border:1px solid var(--border);border-radius:99px;background:var(--panel);
    cursor:pointer;flex:0 0 auto;margin-left:auto;
  }
  .user-btn:hover{background:var(--hover-bg);}
  .user-avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:#fff;
    overflow:hidden;flex:0 0 30px;user-select:none;
  }
  .user-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .user-name{
    font-size:13px;color:var(--text);max-width:100px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .board-tools{display:flex;align-items:center;gap:10px;}
  .notes-tools,.links-tools,.today-tools{display:none;align-items:center;gap:10px;}
  .feedback-tools{display:none;align-items:center;gap:10px;}
  .fb-iter-hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .fb-iter-hint .v{
    background:var(--primary);color:var(--on-primary);
    font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;
  }

  .board-header{
    flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;
    padding:12px 24px 0;gap:10px;flex-wrap:wrap;
  }
  .shift-week-btn{
    display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;
    border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--text);
    font-size:13px;cursor:pointer;font-family:inherit;flex:0 0 auto;
    transition:background .15s,border-color .15s,color .15s;
  }
  .shift-week-btn:hover{background:var(--hover-bg);border-color:var(--primary);}
  .shift-week-btn .icon{font-size:14px;}
  .week-nav{
    display:flex;align-items:center;gap:4px;padding:3px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
  }
  .week-nav.searching{opacity:.55;pointer-events:none;}
  .week-nav button{
    height:30px;min-width:30px;border:none;background:transparent;
    color:var(--muted);border-radius:7px;cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;padding:0 8px;
  }
  .week-nav button:hover{background:var(--hover-bg);color:var(--text);}
  .week-nav select{
    height:30px;border:none;background:transparent;color:var(--text);
    font-size:13px;font-weight:500;padding:0 26px 0 10px;cursor:pointer;
    outline:none;font-family:inherit;min-width:240px;text-align:center;
    text-align-last:center;border-radius:7px;appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%238A867E' d='M2 4l4 4 4-4'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 8px center;background-size:10px;
  }
  .week-nav select option{background:var(--panel);color:var(--text);padding:8px;font-size:13px;}

  .board-view,.notes-view,.review-view,.links-view,.about-view,.today-view,.feedback-view{
    flex:1;display:flex;flex-direction:column;overflow:hidden;
  }
  .board-wrapper{
    flex:1;overflow-x:auto;overflow-y:hidden;padding:16px 24px 20px;
    display:flex;gap:16px;align-items:flex-start;
  }
  .board-wrapper::-webkit-scrollbar{height:8px;}
  .board-wrapper::-webkit-scrollbar-thumb{background:var(--count-bg);border-radius:4px;}
  .list-wrap{flex:1;overflow-y:auto;padding:20px 24px;}

  .column{
    flex:0 0 290px;background:var(--col-bg);border-radius:14px;
    display:flex;flex-direction:column;max-height:100%;
  }
  .column-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 14px 10px 16px;font-size:14px;font-weight:600;
  }
  .col-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .col-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .col-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .col-count{
    font-size:12px;font-weight:400;color:var(--muted);
    background:var(--count-bg);padding:1px 7px;border-radius:99px;flex:0 0 auto;
  }
  .col-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex:0 0 auto;}
  .column:hover .col-actions{opacity:1;}
  .col-btn{
    width:26px;height:26px;border:none;background:transparent;
    font-size:14px;color:var(--muted);cursor:pointer;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .col-btn:hover{background:var(--count-bg);color:var(--text);}
  .col-btn.danger:hover{background:rgba(184,123,114,.15);color:#B87B72;}
  .column-body{flex:1;overflow-y:auto;padding:4px 10px 14px;min-height:80px;}
  .column-body::-webkit-scrollbar{width:5px;}
  .column-body::-webkit-scrollbar-thumb{background:var(--count-bg);border-radius:4px;}

  .card{
    background:var(--panel);border-radius:12px;padding:12px 14px;
    margin-bottom:8px;box-shadow:0 1px 3px var(--shadow);
    cursor:pointer;transition:box-shadow .15s;position:relative;
  }
  .card:hover{box-shadow:0 4px 12px var(--shadow-hover);}
  .card.dragging{opacity:.4;}
  .card.drag-over{border:2px dashed var(--primary);}
  .card.is-today{box-shadow:0 1px 3px var(--shadow),inset 3px 0 0 var(--today-mark);}
  .card-num{
    font-size:10.5px;color:var(--muted);font-weight:500;
    letter-spacing:.3px;margin-bottom:6px;
    display:flex;align-items:center;gap:6px;
  }
  .card-expand-btn{
    width:18px;height:18px;border:none;background:transparent;
    color:var(--muted);font-size:10px;cursor:pointer;border-radius:4px;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .15s,color .15s,transform .15s;line-height:1;
  }
  .card-expand-btn:hover{background:var(--count-bg);color:var(--text);}
  .card-expand-btn.expanded{transform:rotate(180deg);color:var(--primary);}
  .card-title{
    font-size:13.5px;line-height:1.45;word-break:break-word;
    padding-right:96px;
  }
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;user-select:none;}
  .tag.pri-high{background:var(--tag-high-bg);color:var(--tag-high-fg);}
  .tag.pri-normal{background:var(--tag-normal-bg);color:var(--tag-normal-fg);}
  .tag.pri-low{background:var(--tag-low-bg);color:var(--tag-low-fg);}
  .tag.status-soon{background:var(--status-soon-bg);color:var(--status-soon-fg);cursor:pointer;}
  .tag.status-long{background:var(--status-long-bg);color:var(--status-long-fg);cursor:pointer;}
  .tag.status-overdue{background:var(--status-overdue-bg);color:var(--status-overdue-fg);cursor:pointer;}
  .tag.today-tag{background:var(--today-bg);color:var(--today-fg);}
  .tag.remind-tag{background:var(--remind-bg);color:var(--remind-fg);cursor:help;}
  .card-time{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;
    color:var(--muted);margin-top:8px;
    background:var(--chip-bg);padding:3px 9px;border-radius:6px;
  }
  .card-time .week-tag{font-weight:600;color:var(--primary);}

  .card-actions{
    position:absolute;top:8px;right:8px;
    display:flex;gap:2px;
    opacity:0;transition:opacity .15s;z-index:2;
  }
  .card:hover .card-actions{opacity:1;}
  .card-act-btn{
    width:22px;height:22px;border:none;background:transparent;
    color:var(--muted);font-size:12px;cursor:pointer;
    border-radius:5px;display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
    transition:background .15s,color .15s;
  }
  .card-act-btn:hover{background:var(--count-bg);color:var(--text);}
  .card-act-btn.active{color:var(--today-mark);}
  .card-act-btn.danger:hover{background:rgba(184,123,114,.15);color:#B87B72;}

  .card-desc-wrap{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:none;}
  .card-desc-wrap.show{display:block;}
  .card-desc-input{
    width:100%;min-height:70px;padding:8px 10px;
    border:1px solid var(--border);border-radius:8px;
    background:var(--col-bg);color:var(--text);
    font-size:12.5px;line-height:1.55;font-family:inherit;
    outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s;
  }
  .card-desc-input:focus{border-color:var(--primary);background:var(--panel);box-shadow:0 0 0 2px var(--focus-ring);}
  .card-desc-input::placeholder{color:var(--muted);}

  .add-column-btn{
    flex:0 0 240px;border:2px dashed var(--border);border-radius:14px;
    background:transparent;color:var(--muted);font-size:14px;cursor:pointer;
    padding:16px;text-align:center;align-self:flex-start;
  }
  .add-column-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--hover-bg);}
  .empty-col{color:var(--muted);font-size:12px;text-align:center;padding:16px 0;}
  .no-data{color:var(--muted);text-align:center;padding:80px 20px;font-size:14px;}

  .list-view{background:var(--panel);border-radius:14px;padding:20px;}
  .list-view table{width:100%;border-collapse:collapse;font-size:13px;}
  .list-view thead tr{text-align:left;color:var(--muted);border-bottom:1px solid var(--border);}
  .list-view th{padding:10px 12px;font-weight:500;}
  .list-view tbody tr{border-bottom:1px solid var(--border);}
  .list-view tbody tr:hover{background:var(--hover-bg);}
  .list-view td{padding:10px 12px;}
  .list-view .cell-num{color:var(--muted);font-size:12px;font-weight:500;}
  .list-view .cell-title{font-weight:500;}
  .list-view .cell-status{color:var(--muted);display:flex;align-items:center;gap:6px;}
  .list-view .cell-status .dot{width:8px;height:8px;border-radius:50%;}
  .list-view .cell-week{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
  .list-view .cell-week .week-tag{color:var(--primary);font-weight:600;}

  .today-wrapper{flex:1;overflow-y:auto;padding:20px 24px 24px;}
  .today-wrapper::-webkit-scrollbar{width:8px;}
  .today-wrapper::-webkit-scrollbar-thumb{background:var(--count-bg);border-radius:4px;}
  .today-inner{max-width:760px;margin:0 auto;}
  .today-date{
    display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);
    margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);
  }
  .today-date .dow{
    background:var(--primary);color:var(--on-primary);
    font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;
  }
  .today-date .date-text{font-size:16px;font-weight:600;color:var(--text);}
  .today-date .count-hint{margin-left:auto;font-size:12px;}
  .today-section{margin-bottom:24px;}
  .today-section-title{
    font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .today-section-title .num{
    background:var(--chip-bg);color:var(--muted);padding:1px 7px;
    border-radius:99px;font-size:11px;letter-spacing:0;
  }
  .today-list{display:flex;flex-direction:column;gap:6px;}
  .today-item{
    display:flex;align-items:flex-start;gap:12px;background:var(--panel);
    border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px var(--shadow);
    cursor:pointer;transition:box-shadow .15s;
  }
  .today-item:hover{box-shadow:0 4px 12px var(--shadow-hover);}
  .today-check{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);
    flex:0 0 18px;margin-top:2px;display:flex;align-items:center;

    background-repeat:no-repeat;background-position:right 6px center;background-size:9px;
  }
  .fb-status-select[data-status="todo"]{background-color:#B87B72;}
  .fb-status-select[data-status="notdone"]{background-color:#7787B5;}
  .fb-status-select[data-status="fixed"]{background-color:#7B9A7F;}
  .fb-status-select[data-status="paused"]{background-color:#B8924D;}
  .fb-status-select option{background:var(--panel);color:var(--text);}
  .fb-row-del{
    width:26px;height:26px;border:none;background:transparent;
    color:var(--muted);font-size:14px;cursor:pointer;border-radius:6px;
    display:flex;align-items:center;justify-content:center;margin:0 auto;
  }
  .fb-row-del:hover{background:rgba(184,123,114,.15);color:#B87B72;}
  .fb-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px;line-height:1.8;}
  .fb-empty .big{font-size:36px;margin-bottom:12px;}
  .fb-lightbox{
    display:none;position:fixed;inset:0;background:rgba(30,28,26,.9);
    z-index:1500;align-items:center;justify-content:center;padding:30px;
  }
  .fb-lightbox.show{display:flex;}
  .fb-lightbox img{
    max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .fb-lightbox-close{
    position:absolute;top:20px;right:20px;width:40px;height:40px;
    border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .fb-lightbox-close:hover{background:rgba(255,255,255,.25);}

  /* ===== 关于 ===== */
  .about-wrapper{flex:1;overflow-y:auto;padding:20px 24px 30px;}
  .about-wrapper::-webkit-scrollbar{width:8px;}
  .about-wrapper::-webkit-scrollbar-thumb{background:var(--count-bg);border-radius:4px;}
  .about-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .about-card{
    background:var(--panel);border-radius:14px;padding:22px;
    box-shadow:0 1px 3px var(--shadow);
  }
  .about-card-title{
    font-size:14px;font-weight:600;margin-bottom:4px;
    display:flex;align-items:center;gap:8px;
  }
  .about-card-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
  .about-avatar-row{display:flex;align-items:center;gap:16px;padding:4px 0 0;}
  .about-avatar-preview{
    width:64px;height:64px;border-radius:50%;flex:0 0 64px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:600;color:#fff;overflow:hidden;
    cursor:pointer;position:relative;border:2px dashed transparent;
    transition:border-color .15s;
  }
  .about-avatar-preview:hover{border-color:var(--primary);}
  .about-avatar-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .about-avatar-preview .avatar-hint{
    position:absolute;inset:0;background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#fff;opacity:0;transition:opacity .15s;border-radius:50%;
  }
  .about-avatar-preview:hover .avatar-hint{opacity:1;}
  .about-input-row{display:flex;gap:8px;align-items:center;margin-top:14px;}
  .about-input-row input{
    flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:13px;font-family:inherit;background:var(--panel);color:var(--text);outline:none;
  }
  .about-input-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring);}
  .about-input-row label{font-size:12px;color:var(--muted);flex:0 0 60px;}
  .btn-about{
    padding:9px 18px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--text);font-size:13px;
    cursor:pointer;font-family:inherit;flex:0 0 auto;
  }
  .btn-about:hover{background:var(--hover-bg);}
  .btn-about.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}
  .btn-about.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);}
  .about-btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .about-steps{display:flex;flex-direction:column;gap:14px;}
  .about-step{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.7;color:var(--text);}
  .about-step .step-num{
    flex:0 0 22px;width:22px;height:22px;border-radius:50%;
    background:var(--chip-bg);color:var(--muted);font-size:11px;font-weight:600;
    display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .about-step code{
    background:var(--chip-bg);padding:1px 6px;border-radius:4px;
    font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--primary);
  }

  /* ===== 版本更新记录 ===== */
  .ver-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:16px;
  }
  .ver-current{
    display:flex;align-items:center;gap:10px;
  }
  .ver-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:99px;
    background:var(--primary);color:var(--on-primary);
    font-size:13px;font-weight:600;letter-spacing:.3px;
  }
  .ver-badge::before{
    content:'';width:6px;height:6px;border-radius:50%;
    background:currentColor;opacity:.75;
  }
  .ver-date{
    font-size:12px;color:var(--muted);
  }
  .ver-timeline{
    display:flex;flex-direction:column;gap:0;
    position:relative;
  }
  .ver-item{
    display:flex;gap:14px;
    padding:14px 0;
    position:relative;
  }
  .ver-item + .ver-item{
    border-top:1px dashed var(--border);
  }
  .ver-dot-col{
    flex:0 0 20px;display:flex;flex-direction:column;
    align-items:center;padding-top:5px;
  }
  .ver-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--primary);flex:0 0 auto;
    box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--border);
  }
  .ver-item.current .ver-dot{
    box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--primary);
  }
  .ver-body{flex:1;min-width:0;}
  .ver-title-row{
    display:flex;align-items:baseline;gap:10px;
    margin-bottom:8px;flex-wrap:wrap;
  }
  .ver-num{
    font-size:15px;font-weight:600;color:var(--text);
  }
  .ver-item.current .ver-num{
    color:var(--primary);
  }
  .ver-tag{
    font-size:10.5px;padding:1px 7px;border-radius:5px;
    background:var(--chip-bg);color:var(--muted);
    letter-spacing:.2px;
  }
  .ver-item.current .ver-tag{
    background:var(--remind-bg);color:var(--remind-fg);
  }
  .ver-change-date{
    font-size:11px;color:var(--muted);margin-left:auto;
  }
  .ver-changes{
    list-style:none;display:flex;flex-direction:column;gap:6px;
  }
  .ver-changes li{
    font-size:12.5px;line-height:1.65;color:var(--text);
    display:flex;gap:8px;align-items:flex-start;
    position:relative;padding-left:2px;
  }
  .ver-changes li::before{
    content:'';flex:0 0 5px;width:5px;height:5px;
    border-radius:50%;background:var(--muted);
    margin-top:8px;
  }
  .ver-changes li .type{
    font-size:10.5px;padding:0 6px;border-radius:4px;
    background:var(--chip-bg);color:var(--muted);
    flex:0 0 auto;margin-top:1px;
    letter-spacing:.2px;
  }
  .ver-changes li .type.feat{background:var(--tag-normal-bg);color:var(--tag-normal-fg);}
  .ver-changes li .type.fix{background:var(--tag-high-bg);color:var(--tag-high-fg);}
  .ver-changes li .type.ui{background:var(--tag-low-bg);color:var(--tag-low-fg);}
  .ver-changes li .type.refactor{background:var(--status-long-bg);color:var(--status-long-fg);}

  /* 弹窗 */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(30,28,26,.5);
    z-index:1000;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--panel);border-radius:16px;padding:26px;
    width:420px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);
    animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{font-size:16px;margin-bottom:18px;}
  .modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;margin-top:16px;}
  .modal label:first-of-type{margin-top:0;}
  .modal input[type="text"],.modal input[type="url"],.modal input[type="datetime-local"],
  .modal select,.modal textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;outline:none;font-family:inherit;background:var(--panel);color:var(--text);
  }
  .modal textarea{min-height:120px;resize:vertical;line-height:1.55;}
  .modal input:focus,.modal select:focus,.modal textarea:focus{
    border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring);
  }
  .color-picker{display:flex;gap:8px;flex-wrap:wrap;}
  .color-swatch{
    width:28px;height:28px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;transition:transform .1s,box-shadow .15s;
  }
  .color-swatch:hover{transform:scale(1.12);}
  .color-swatch.selected{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--text);}
  .priority-picker,.status-picker{display:flex;gap:8px;}
  .priority-picker button,.status-picker button{
    flex:1;padding:9px 4px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;
  }
  .priority-picker button:hover,.status-picker button:hover{background:var(--hover-bg);}
  .priority-picker button.selected[data-pri="high"]{
    background:var(--tag-high-bg);border-color:var(--tag-high-fg);color:var(--tag-high-fg);font-weight:500;
  }
  .priority-picker button.selected[data-pri="normal"]{
    background:var(--tag-normal-bg);border-color:var(--tag-normal-fg);color:var(--tag-normal-fg);font-weight:500;
  }
  .priority-picker button.selected[data-pri="low"]{
    background:var(--tag-low-bg);border-color:var(--tag-low-fg);color:var(--tag-low-fg);font-weight:500;
  }
  .status-picker button{font-size:12px;padding:9px 2px;}
  .status-picker button.selected[data-status=""]{
    background:var(--chip-bg);border-color:var(--muted);color:var(--text);font-weight:500;
  }
  .status-picker button.selected[data-status="soon"]{
    background:var(--status-soon-bg);border-color:var(--status-soon-fg);color:var(--status-soon-fg);font-weight:500;
  }
  .status-picker button.selected[data-status="long"]{
    background:var(--status-long-bg);border-color:var(--status-long-fg);color:var(--status-long-fg);font-weight:500;
  }
  .status-picker button.selected[data-status="overdue"]{
    background:var(--status-overdue-bg);border-color:var(--status-overdue-fg);color:var(--status-overdue-fg);font-weight:500;
  }
  .today-toggle-btn{
    width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);font-size:13px;color:var(--muted);cursor:pointer;
    font-family:inherit;display:flex;align-items:center;justify-content:center;
    gap:6px;transition:all .15s;
  }
  .today-toggle-btn:hover{background:var(--hover-bg);}
  .today-toggle-btn.active{background:var(--today-bg);border-color:var(--today-fg);color:var(--today-fg);font-weight:500;}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:26px;}
  .modal-actions .left-actions{display:flex;gap:8px;}
  .modal-actions button{
    padding:9px 22px;border-radius:10px;font-size:13px;cursor:pointer;
    border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-family:inherit;
  }
  .modal-actions button:hover{background:var(--hover-bg);}
  .modal-actions .btn-confirm{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}
  .modal-actions .btn-confirm:hover{background:var(--primary-hover);border-color:var(--primary-hover);}
  .modal-actions .btn-danger{color:#B87B72;border-color:rgba(184,123,114,.3);}
  .modal-actions .btn-danger:hover{background:rgba(184,123,114,.1);}

  .remind-row{display:flex;gap:8px;align-items:center;}
  .remind-clear-btn{
    padding:10px 14px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--muted);font-size:12.5px;
    cursor:pointer;font-family:inherit;flex:0 0 auto;
  }
  .remind-clear-btn:hover{background:var(--hover-bg);color:var(--text);}
  .remind-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}

  #archive-list{max-height:420px;overflow-y:auto;margin:0 -8px;padding:0 8px;}
  #archive-list::-webkit-scrollbar{width:6px;}
  #archive-list::-webkit-scrollbar-thumb{background:var(--count-bg);border-radius:3px;}
  .archive-item{
    display:flex;align-items:center;gap:12px;padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .archive-item:last-child{border-bottom:none;}
  .archive-item .a-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .archive-item .a-body{flex:1;min-width:0;}
  .archive-item .a-title{
    font-size:13px;margin-bottom:4px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;
  }
  .archive-item .a-meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
  .archive-item .a-meta .done-date{color:var(--primary);font-weight:500;}
  .archive-item .a-actions{display:flex;gap:6px;flex:0 0 auto;}
  .archive-item .a-btn{
    padding:5px 11px;font-size:11px;border-radius:6px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;
  }
  .archive-item .a-btn:hover{background:var(--hover-bg);}
  .archive-item .a-btn.danger{color:#B87B72;}
  .archive-item .a-btn.danger:hover{background:rgba(184,123,114,.1);}
  .archive-empty{text-align:center;color:var(--muted);padding:50px 0;font-size:13px;}

  .iter-shots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
  .iter-shot-item{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--chip-bg);}
  .iter-shot-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .iter-shot-item .iter-shot-del{
    position:absolute;top:3px;right:3px;width:18px;height:18px;
    border:none;background:rgba(0,0,0,.5);color:#fff;font-size:11px;
    cursor:pointer;border-radius:50%;display:flex;align-items:center;
    justify-content:center;line-height:1;padding:0;
  }
  .iter-shot-item .iter-shot-del:hover{background:rgba(184,123,114,.9);}

  .reminder-stack{
    position:fixed;bottom:20px;right:20px;z-index:900;
    display:flex;flex-direction:column;gap:10px;
    max-width:360px;width:100%;pointer-events:none;
  }
  .reminder-item{
    background:var(--panel);border-radius:14px;
    padding:14px 16px 14px 14px;
    box-shadow:0 8px 28px rgba(30,28,26,.18),0 2px 6px rgba(30,28,26,.1);
    border-left:4px solid var(--today-mark);
    display:flex;gap:12px;align-items:flex-start;
    cursor:pointer;pointer-events:auto;
    animation:reminderIn .3s cubic-bezier(.16,1,.3,1);
    transition:transform .15s,box-shadow .15s;position:relative;
  }
  .reminder-item:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(30,28,26,.24),0 3px 8px rgba(30,28,26,.14);
  }
  @keyframes reminderIn{from{opacity:0;transform:translateX(20px) scale(.95);}to{opacity:1;transform:translateX(0) scale(1);}}
  .reminder-item.removing{animation:reminderOut .25s ease forwards;}
  @keyframes reminderOut{to{opacity:0;transform:translateX(30px) scale(.9);}}
  .reminder-icon{
    font-size:20px;flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    background:var(--today-bg);display:flex;align-items:center;justify-content:center;
  }
  .reminder-body{flex:1;min-width:0;}
  .reminder-title{
    font-size:13px;font-weight:600;line-height:1.4;margin-bottom:6px;
    word-break:break-word;padding-right:20px;
  }
  .reminder-title .reminder-num{
    display:inline-block;background:var(--chip-bg);color:var(--muted);
    font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;
    margin-right:5px;vertical-align:middle;
  }
  .reminder-text{
    font-size:12.5px;line-height:1.5;background:var(--remind-bg);
    padding:7px 10px;border-radius:8px;color:var(--remind-fg);font-weight:500;
  }
  .reminder-time{font-size:10.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:4px;}
  .reminder-close{
    position:absolute;top:8px;right:8px;width:20px;height:20px;
    border:none;background:transparent;color:var(--muted);font-size:14px;
    cursor:pointer;border-radius:5px;display:flex;align-items:center;
    justify-content:center;padding:0;line-height:1;
    transition:background .15s,color .15s;
  }
  .reminder-close:hover{background:var(--count-bg);color:var(--text);}

  @media (max-width:720px){
    .sidebar{flex:0 0 60px;}
    .sidebar-title,.sidebar-signature{display:none;}
    .edit-title-btn{opacity:1;margin:0 auto;}
    .sidebar-header{padding:14px 8px;justify-content:center;}
    .nav-item{justify-content:center;padding:10px;}
    .nav-item span:not(.icon):not(.badge){display:none;}
    .nav-item .badge{display:none;}
    .top-bar{padding:10px 14px;gap:8px;}
    .board-header{padding:10px 14px 0;}
    .review-header{padding:10px 14px 0;}
    .board-wrapper,.notes-wrapper,.review-body,.links-wrapper,.about-wrapper,.today-wrapper{padding:12px 14px 16px;}
    .column{flex:0 0 260px;}
    .user-name{display:none;}
    .week-nav select{min-width:180px;font-size:12px;}
    .archive-btn .btn-text{display:none;}
    .link-info{padding-right:80px;}
    .card-title{padding-right:96px;}
    .fb-iterations{flex:0 0 180px;}
    .fb-cell-shot{width:90px;}
    .fb-cell-status{width:90px;}
    .fb-cell-custom{width:100px;min-width:100px;}
    .fb-cell-time{width:100px;}
    .reminder-stack{max-width:calc(100% - 30px);bottom:10px;right:10px;}
    .shift-week-btn .btn-text{display:none;}
  }
</style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-group">
        <span class="sidebar-title" id="app-title" title="点击重命名">我的工作台</span>
        <span class="sidebar-signature empty" id="sidebar-signature" title="点击编辑个性签名"></span>
      </div>
      <button class="edit-title-btn" id="edit-title-btn" title="重命名">✎</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-nav="board"><span class="icon">📋</span><span>看板</span></button>
      <button class="nav-item" data-nav="today"><span class="icon">☀️</span><span>今日</span><span class="badge" id="today-badge">0</span></button>
      <button class="nav-item" data-nav="notes"><span class="icon">📝</span><span>随笔</span></button>
      <button class="nav-item" data-nav="review"><span class="icon">📊</span><span>本周复盘</span></button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-nav="feedback"><span class="icon">🎨</span><span>项目迭代</span><span class="badge" id="fb-badge">0</span></button>
      <button class="nav-item" data-nav="links"><span class="icon">🔗</span><span>网址直达</span></button>
      <button class="nav-item" data-nav="about"><span class="icon">ℹ️</span><span>关于</span></button>
    </nav>
  </aside>

  <div class="main-area">
    <div class="top-bar">
      <input type="text" id="search-input" placeholder="搜索全部任务…">
      <div class="board-tools" id="board-tools">
        <select id="priority-filter">
          <option value="all">全部优先级</option>
          <option value="high">重要</option>
          <option value="normal">普通</option>
          <option value="low">次要</option>
        </select>
        <button class="archive-btn" id="archive-btn" title="查看已归档任务">
          📦 <span class="btn-text">归档</span><span class="count" id="archive-count">0</span>
        </button>
        <div class="view-switch">
          <button class="view-btn active" id="view-board">看板</button>
          <button class="view-btn" id="view-list">列表</button>

function getWeekDates(offset){
  const now=new Date();const dow=now.getDay();
  const monday=new Date(now);const diff=dow===0?-6:1-dow;
  monday.setDate(now.getDate()+diff+offset*7);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  return {monday,sunday};
}

function compressImage(file,maxSize=900,quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxSize){h=h*maxSize/w;w=maxSize;}
        else if(h>=w&&h>maxSize){w=w*maxSize/h;h=maxSize;}
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(w);canvas.height=Math.round(h);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

  state.feedback={iterations:[],currentIterId:null,
    customFields:[{id:'cf1',name:'字段1'},{id:'cf2',name:'字段2'},{id:'cf3',name:'字段3'}]};

}

/* ========== 存储 ========== */
function load(){
  let raw=localStorage.getItem(STORAGE_KEY);
  for(const k of ['pm_personal_v23','pm_personal_v22','pm_personal_v21','pm_personal_v20','pm_personal_v19']){
    if(!raw)raw=localStorage.getItem(k);
  }
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(parsed&&Array.isArray(parsed.columns)){
        state.columns=parsed.columns.map(col=>({...col,cards:(col.cards||[]).map(c=>({
          ...c,isToday:c.isToday===true,
          description:typeof c.description==='string'?c.description:'',
          remindAt:(typeof c.remindAt==='number'||c.remindAt===null)?c.remindAt:null
        }))}));
        state.notes=(Array.isArray(parsed.notes)?parsed.notes:[]).map(n=>({...n,pinned:n.pinned===true}));
        state.reviews=(parsed.reviews&&typeof parsed.reviews==='object')?parsed.reviews:{};
        state.linkCategories=Array.isArray(parsed.linkCategories)&&parsed.linkCategories.length
          ?parsed.linkCategories:[{id:DEFAULT_CAT_ID,name:'未分类'}];
        if(!state.linkCategories.find(c=>c.id===DEFAULT_CAT_ID))
          state.linkCategories.unshift({id:DEFAULT_CAT_ID,name:'未分类'});
        state.links=(Array.isArray(parsed.links)?parsed.links:[]).map(l=>({...l,categoryId:l.categoryId||DEFAULT_CAT_ID}));

        let maxNum=typeof parsed.nextCardNum==='number'?parsed.nextCardNum-1:0;
        state.columns.forEach(col=>(col.cards||[]).forEach(c=>{
          if(typeof c.number==='number'&&c.number>maxNum)maxNum=c.number;
        }));
        state.columns.forEach(col=>(col.cards||[]).forEach(c=>{
          if(typeof c.number!=='number')c.number=++maxNum;
        }));
        state.nextCardNum=maxNum+1;

        if(parsed.feedback&&Array.isArray(parsed.feedback.iterations)){
          const cf=Array.isArray(parsed.feedback.customFields)&&parsed.feedback.customFields.length
            ?parsed.feedback.customFields
            :[{id:'cf1',name:'字段1'},{id:'cf2',name:'字段2'},{id:'cf3',name:'字段3'}];
          const iterations=parsed.feedback.iterations.map(it=>{
            const iterDate=it.date||Date.now();
            return {
              id:it.id||uid(),version:it.version||1,date:iterDate,
              updatedAt:it.updatedAt||iterDate,note:it.note||'',
              screenshots:Array.isArray(it.screenshots)?it.screenshots:[],
              rows:(it.rows||[]).map(r=>{
                const custom=r.custom&&typeof r.custom==='object'?{...r.custom}:{};
                if(r.knowledge&&!custom['cf1'])custom['cf1']=r.knowledge;
                if(r.ref1&&!custom['cf2'])custom['cf2']=r.ref1;
                if(r.ref2&&!custom['cf3'])custom['cf3']=r.ref2;
                return {
                  id:r.id||uid(),screenshot:r.screenshot||'',comment:r.comment||'',
                  status:FB_STATUS[r.status]?r.status:'todo',custom,
                  createdAt:r.createdAt||iterDate,updatedAt:r.updatedAt||r.lastUpdated||r.createdAt||iterDate
                };
              })
            };
          });
          state.feedback={
            iterations,
            currentIterId:parsed.feedback.currentIterId||(iterations.length?iterations[0].id:null),
            customFields:cf
          };
        }else{
          state.feedback={iterations:[],currentIterId:null,
            customFields:[{id:'cf1',name:'字段1'},{id:'cf2',name:'字段2'},{id:'cf3',name:'字段3'}]};
        }
        save();return;
      }
    }catch(e){console.warn('数据解析失败',e);}
  }
  initSampleData();
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch(e){
    if(e.name==='QuotaExceededError'||e.code===22)
      alert('本地存储已满！\n\n可能是项目迭代里图片太多。\n建议：\n1. 先导出一次备份\n2. 删除一些旧的迭代或反馈截图');
    else console.warn('保存失败',e);
  }
}

/* ========== 导出/导入 ========== */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`${appTitle}-备份-${toDateStr(new Date())}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importDataFromFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data||!Array.isArray(data.columns))throw new Error('文件格式不正确，缺少必要字段');
      if(!confirm('导入会覆盖当前所有数据。\n\n建议先导出一次当前数据。确定继续？')){e.target.value='';return;}

      let maxNum=typeof data.nextCardNum==='number'?data.nextCardNum-1:0;
      const newCols=data.columns.map(col=>({
        ...col,
        cards:(col.cards||[]).map(c=>{
          const nc={...c,isToday:c.isToday===true,
            description:typeof c.description==='string'?c.description:'',
            remindAt:(typeof c.remindAt==='number'||c.remindAt===null)?c.remindAt:null};
          if(typeof nc.number==='number'&&nc.number>maxNum)maxNum=nc.number;
          return nc;
        })
      }));
      newCols.forEach(col=>col.cards.forEach(c=>{if(typeof c.number!=='number')c.number=++maxNum;}));

      const cf=(data.feedback&&Array.isArray(data.feedback.customFields)&&data.feedback.customFields.length)
        ?data.feedback.customFields
        :[{id:'cf1',name:'字段1'},{id:'cf2',name:'字段2'},{id:'cf3',name:'字段3'}];
      const iterations=(data.feedback&&Array.isArray(data.feedback.iterations))
        ?data.feedback.iterations.map(it=>{
            const iterDate=it.date||Date.now();
            return {
              id:it.id||uid(),version:it.version||1,date:iterDate,
              updatedAt:it.updatedAt||iterDate,note:it.note||'',
              screenshots:Array.isArray(it.screenshots)?it.screenshots:[],
              rows:Array.isArray(it.rows)?it.rows.map(r=>({
                id:r.id||uid(),screenshot:r.screenshot||'',comment:r.comment||'',
                status:FB_STATUS[r.status]?r.status:'todo',
                custom:(r.custom&&typeof r.custom==='object')?{...r.custom}:{},
                createdAt:r.createdAt||iterDate,updatedAt:r.updatedAt||r.createdAt||iterDate
              })):[]
            };
          })
        :[];

      state={
        columns:newCols,
        notes:(Array.isArray(data.notes)?data.notes:[]).map(n=>({...n,pinned:n.pinned===true})),
        reviews:(data.reviews&&typeof data.reviews==='object')?data.reviews:{},
        linkCategories:Array.isArray(data.linkCategories)&&data.linkCategories.length
          ?data.linkCategories:[{id:DEFAULT_CAT_ID,name:'未分类'}],
        links:(Array.isArray(data.links)?data.links:[]).map(l=>({...l,categoryId:l.categoryId||DEFAULT_CAT_ID})),
        nextCardNum:maxNum+1,
        feedback:{
          iterations,
          currentIterId:(data.feedback&&data.feedback.currentIterId)||(iterations.length?iterations[0].id:null),
          customFields:cf
        }
      };
      if(!state.linkCategories.find(c=>c.id===DEFAULT_CAT_ID))
        state.linkCategories.unshift({id:DEFAULT_CAT_ID,name:'未分类'});
      save();render();
      alert('✅ 导入成功！所有数据已恢复。');
    }catch(err){alert('❌ 导入失败：\n\n'+err.message);}
    e.target.value='';
  };
  reader.readAsText(file);
}

/* ========== 自动归档 ========== */
function runArchiveCheck(){
  const cutoff=Date.now()-ARCHIVE_AFTER_DAYS*86400000;
  let changed=false;
  state.columns.forEach(col=>{
    const isDone=col.group==='done';
    col.cards.forEach(card=>{
      if(isDone){
        if(!card.completedAt){card.completedAt=Date.now();changed=true;}
        if(!card.archived&&card.completedAt<cutoff){card.archived=true;changed=true;}
        if(card.isToday){card.isToday=false;changed=true;}
        if(card.remindAt){card.remindAt=null;changed=true;}
      }else{
        if(card.completedAt||card.archived){card.completedAt=null;card.archived=false;changed=true;}
      }
    });
  });
  if(changed)save();
}
function getArchivedCards(){
  const arr=[];
  state.columns.forEach(col=>col.cards.forEach(c=>{
    if(c.archived)arr.push({...c,__colId:col.id,__colTitle:col.title,__colColor:col.color});
  }));
  arr.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  return arr;
}
const updateArchiveCount=()=>{document.getElementById('archive-count').textContent=getArchivedCards().length;};
function updateTodayBadge(){
  let n=0;
  state.columns.forEach(col=>{
    if(col.group==='done')return;
    col.cards.forEach(c=>{if(!c.archived&&c.isToday)n++;});
  });
  document.getElementById('today-badge').textContent=n;
}
function updateFbBadge(){
  let n=0;
  state.feedback.iterations.forEach(it=>(it.rows||[]).forEach(r=>{if(r.status!=='fixed')n++;}));
  const el=document.getElementById('fb-badge');if(el)el.textContent=n;
}

/* ========== 数据过滤 ========== */
const getCol=id=>state.columns.find(c=>c.id===id);
function getVisibleCards(cards,isBoardView){
  const isSearching=filter.keyword.length>0;
  const weekStart=isBoardView&&!isSearching?getWeekStartStr(currentWeekOffset):null;
  return cards.filter(c=>{
    if(c.archived)return false;
    if(weekStart&&c.weekStart!==weekStart)return false;
    if(filter.priority!=='all'&&c.priority!==filter.priority)return false;
    if(isSearching){
      const kw=filter.keyword.toLowerCase();
      if(!(c.title||'').toLowerCase().includes(kw)&&!(c.description||'').toLowerCase().includes(kw))return false;
    }
    return true;
  });
}
function sortCardsForDisplay(cards){
  return cards.slice().sort((a,b)=>(PRI_WEIGHT[b.priority]||0)-(PRI_WEIGHT[a.priority]||0));
}
const PRI_LABEL={high:'重要',normal:'普通',low:'次要'};
const STATUS_LABEL={soon:'近期',long:'长期',overdue:'延期'};
const STATUS_CYCLE={'':'soon','soon':'long','long':'overdue','overdue':''};

  return html;

/* ========== 一键挪到下周 ========== */
function shiftWeekToNext(){
  const fromWeekStart=getWeekStartStr(currentWeekOffset);
  const toWeekStart=getWeekStartStr(currentWeekOffset+1);
  const fromLabel=formatWeekRangeFromStr(fromWeekStart)+(getWeekTag(currentWeekOffset)?` (${getWeekTag(currentWeekOffset)})`:'');
  const toLabel=formatWeekRangeFromStr(toWeekStart)+(getWeekTag(currentWeekOffset+1)?` (${getWeekTag(currentWeekOffset+1)})`:'');
  const movable=[];
  state.columns.forEach(col=>{
    if(col.group==='done')return;
    col.cards.forEach(c=>{
      if(c.archived)return;
      if(c.weekStart===fromWeekStart)movable.push({card:c,col});
    });
  });
  if(!movable.length){alert(`「${fromLabel}」没有可挪动的卡片。\n（已完成列不会被移动）`);return;}
  if(!confirm(`即将把「${fromLabel}」的 ${movable.length} 个卡片挪到「${toLabel}」。\n\n已完成列的卡片不会被移动。\n确定继续吗？`))return;
  movable.forEach(({card})=>{card.weekStart=toWeekStart;card.updatedAt=Date.now();});
  save();render();
}

/* ========== 卡片顺序调整 ========== */
function moveCard(cardId,colId,direction){
  const col=getCol(colId);if(!col)return;
  const idx=col.cards.findIndex(c=>c.id===cardId);
  if(idx===-1)return;
  const cur=col.cards[idx];
  let targetIdx=-1;
  if(direction==='up'){
    for(let i=idx-1;i>=0;i--){
      if(col.cards[i].priority===cur.priority){targetIdx=i;break;}
    }
  }else{
    for(let i=idx+1;i<col.cards.length;i++){
      if(col.cards[i].priority===cur.priority){targetIdx=i;break;}
    }
  }
  if(targetIdx===-1)return;
  [col.cards[idx],col.cards[targetIdx]]=[col.cards[targetIdx],col.cards[idx]];
  save();render();
}

        </div>
      </div>
    </div>`;
}
function toggleTaskComplete(colId,cardId){
  const col=getCol(colId);if(!col)return;
  const card=col.cards.find(c=>c.id===cardId);if(!card)return;
  const doneCol=state.columns.find(c=>c.group==='done');
  if(!doneCol){alert('没有找到"已完成"分组');return;}
  col.cards=col.cards.filter(c=>c.id!==cardId);
  if(col.group==='done'){
    const target=state.columns.find(c=>c.group==='doing');
    if(target){card.completedAt=null;card.archived=false;target.cards.unshift(card);}
  }else{
    card.completedAt=Date.now();card.archived=false;card.isToday=false;card.remindAt=null;
    doneCol.cards.unshift(card);
  }
  save();render();
}

/* ========== 随笔渲染 ========== */
function renderNotes(){
  const wrap=document.getElementById('notes-wrapper');
  wrap.innerHTML='';
  let notes=[...state.notes];
  if(filter.keyword){
    const kw=filter.keyword.toLowerCase();
    notes=notes.filter(n=>(n.content||'').toLowerCase().includes(kw));
  }
  notes.sort((a,b)=>{
    if(a.pinned && !b.pinned) return -1;
    if(!a.pinned && b.pinned) return 1;
    return (b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0);
  });
  if(!notes.length){
    wrap.innerHTML=`<div class="notes-empty"><div class="big">📝</div>
      <div>${filter.keyword?'没有匹配的随笔':'还没有随笔'}</div>
      ${filter.keyword?'':'<div style="margin-top:8px;">点击右上角 ＋ 记录你的第一个想法</div>'}</div>`;
    return;
  }
  const grid=document.createElement('div');
  grid.className='notes-grid';
  grid.innerHTML=notes.map(n=>`
    <div class="note-card ${n.pinned?'pinned':''}" data-note-id="${n.id}">
      <div class="note-actions">
        <button class="note-act-btn ${n.pinned?'active':''}" data-act="pin-note" data-note-id="${n.id}" title="${n.pinned?'取消置顶':'置顶'}">📌</button>
        <button class="note-act-btn danger" data-act="del-note" data-note-id="${n.id}" title="删除">×</button>
      </div>
      <div class="note-content">${esc(n.content||'')}</div>
      <div class="note-footer">
        <span>${n.pinned?'📌 已置顶':''}</span>
        <span>🕒 ${formatDateTimeCN(n.updatedAt||n.createdAt)}</span>
      </div>
    </div>`).join('');
  wrap.appendChild(grid);
  grid.querySelectorAll('.note-card').forEach(cardEl=>{
    cardEl.onclick=e=>{
      const noteId=cardEl.dataset.noteId;
      if(e.target.dataset.act==='del-note'){e.stopPropagation();deleteNote(noteId);return;}
      if(e.target.dataset.act==='pin-note'){e.stopPropagation();togglePinNote(noteId);return;}
      openNoteModal('edit',noteId);
    };
  });
}
function deleteNote(noteId){
  if(!state.notes.find(n=>n.id===noteId))return;
  if(!confirm('确定删除这条随笔？'))return;
  state.notes=state.notes.filter(n=>n.id!==noteId);
  save();render();
}
function togglePinNote(noteId){
  const note=state.notes.find(n=>n.id===noteId);
  if(!note)return;
  note.pinned=!note.pinned;
  note.updatedAt=Date.now();
  save();render();
}

/* ========== 复盘渲染 ========== */
function getWeekStats(offset){
  const weekStart=getWeekStartStr(offset);
  const tasks=[];
  state.columns.forEach(col=>col.cards.forEach(c=>{
    if(c.weekStart===weekStart)
      tasks.push({...c,__colTitle:col.title,__colGroup:col.group,__colColor:col.color});
  }));
  const total=tasks.length;
  const done=tasks.filter(t=>t.__colGroup==='done').length;
  const rate=total?Math.round(done/total*100):0;
  const byCol={};
  tasks.forEach(t=>{
    if(!byCol[t.__colTitle])byCol[t.__colTitle]={total:0,done:0,color:t.__colColor};
    byCol[t.__colTitle].total++;
    if(t.__colGroup==='done')byCol[t.__colTitle].done++;
  });
  const overdue=tasks.filter(t=>t.status==='overdue').length;
  return {tasks,total,done,rate,byCol,overdue};
}
function renderReview(){

  const {monday,sunday}=getWeekDates(currentWeekOffset);

  const tag=getWeekTag(currentWeekOffset)||'';

  const distItems=Object.entries(stats.byCol).map(([name,info])=>
    `<div class="dist-item"><span class="dot" style="background:${info.color}"></span>
      <span>${esc(name)}</span><span class="count">${info.done}/${info.total}</span></div>`
  ).join('')||'<div style="color:var(--muted);font-size:12px;">本周暂无任务</div>';
  const historyKeys=Object.keys(state.reviews).sort((a,b)=>b.localeCompare(a)).slice(0,8);
  const historyHtml=historyKeys.length?`
    <div class="review-history">
      <div class="review-history-title">历史复盘</div>
      <div class="history-list">
        ${historyKeys.map(k=>{

          return `<button class="history-chip ${k===weekStart?'active':''}" data-review-week="${k}">
            ${esc(formatWeekRangeFromStr(k))}${wTag?`<span class="tag-sm">${wTag}</span>`:''}</button>`;
        }).join('')}
      </div>
    </div>`:'';
  body.innerHTML=`
    <div class="review-inner">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">
        ${tag?`<span style="color:var(--primary);font-weight:600;">${tag}</span> · `:''}${dateRange}
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">本周任务</div><div class="stat-value">${stats.total}</div></div>
        <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-value primary">${stats.done}</div></div>
        <div class="stat-card"><div class="stat-label">完成率</div><div class="stat-value">${stats.rate}%</div></div>
        <div class="stat-card"><div class="stat-label">标记延期</div><div class="stat-value ${stats.overdue>0?'high':''}">${stats.overdue}</div></div>
      </div>
      <div class="dist-section"><div class="dist-title">分类分布</div><div class="dist-list">${distItems}</div></div>
      ${historyHtml}
      <div class="review-editor-wrap">
        <div class="review-meta">
          <span>复盘内容</span>
          ${saved?`<span class="badge">已存档 · 更新于 ${formatDateTimeCN(saved.updatedAt)}</span>`:'<span class="badge">未存档</span>'}
        </div>
        <textarea id="review-textarea" placeholder="在这里写这一周的复盘吧：&#10;&#10;一、本周做了什么&#10;&#10;二、遇到的问题&#10;&#10;三、下周计划"></textarea>
        <div class="review-actions">
          ${saved?`<button class="btn-action danger" id="btn-delete-review">🗑 删除存档</button>`:''}
          <button class="btn-action primary" id="btn-save-review">💾 保存</button>
        </div>
      </div>
    </div>`;
  const ta=document.getElementById('review-textarea');
  if(saved)ta.value=saved.content;
  body.querySelectorAll('[data-review-week]').forEach(chip=>{
    chip.onclick=()=>{currentWeekOffset=weekStartToOffset(chip.dataset.reviewWeek);render();};
  });
  document.getElementById('btn-save-review').onclick=()=>{
    const btn=document.getElementById('btn-save-review');
    state.reviews[getWeekStartStr(currentWeekOffset)]={content:ta.value,updatedAt:Date.now()};
    save();btn.textContent='✓ 已保存';
    setTimeout(()=>renderReview(),800);
  };
  const delBtn=document.getElementById('btn-delete-review');
  if(delBtn)delBtn.onclick=()=>{
    if(!confirm('确定删除这一周的复盘存档？'))return;
    delete state.reviews[getWeekStartStr(currentWeekOffset)];
    save();render();
  };
}

let saveTimer=null;

  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{save();updateFbBadge();},400);
}
function addFeedbackRow(){
  const it=state.feedback.iterations.find(x=>x.id===state.feedback.currentIterId);

  it.rows.push({id:uid(),screenshot:'',comment:'',custom:{},status:'todo',createdAt:now,updatedAt:now});

function addCustomField(){

function deleteIteration(iterId){
  const it=state.feedback.iterations.find(x=>x.id===iterId);if(!it)return;
  if(!confirm(`确定删除迭代 #${it.version} 及其下所有反馈？\n此操作不可恢复。`))return;

    state.feedback.currentIterId=state.feedback.iterations.length?state.feedback.iterations[0].id:null;

function openIterModal(mode,iterId){
  iterModalState.mode=mode||'create';
  iterModalState.iterId=iterId||null;
  const titleEl=document.getElementById('iter-modal-title');
  const noteEl=document.getElementById('iter-note-input');
  const confirmBtn=document.getElementById('iter-modal-confirm');
  if(mode==='edit'){
    const it=state.feedback.iterations.find(x=>x.id===iterId);if(!it)return;
    titleEl.textContent=`编辑迭代 #${it.version}`;
    noteEl.value=it.note||'';
    iterModalState.shots=[...(it.screenshots||[])];
    confirmBtn.textContent='保存';
  }else{
    titleEl.textContent='新建迭代';noteEl.value='';iterModalState.shots=[];confirmBtn.textContent='创建';
  }
  document.getElementById('iter-shots-input').value='';
  renderIterShotsPreview();
  document.getElementById('iter-modal').classList.add('show');
  setTimeout(()=>noteEl.focus(),50);
}
const closeIterModal=()=>document.getElementById('iter-modal').classList.remove('show');
function confirmIterModal(){
  const note=document.getElementById('iter-note-input').value.trim();
  const now=Date.now();
  if(iterModalState.mode==='create'){
    const nextVersion=state.feedback.iterations.length
      ?Math.max(...state.feedback.iterations.map(x=>x.version||0))+1:1;
    const it={id:uid(),version:nextVersion,date:now,updatedAt:now,note,screenshots:[...iterModalState.shots],rows:[]};
    state.feedback.iterations.push(it);
    state.feedback.currentIterId=it.id;
  }else{
    const it=state.feedback.iterations.find(x=>x.id===iterModalState.iterId);if(!it)return;
    it.note=note;it.screenshots=[...iterModalState.shots];it.updatedAt=now;
  }
  save();render();closeIterModal();
}

/* ========== 网址渲染 ========== */
function renderLinks(){
  const wrap=document.getElementById('links-wrapper');
  wrap.innerHTML='';
  const cats=state.linkCategories.slice();
  let links=[...state.links];
  if(filter.keyword){
    const kw=filter.keyword.toLowerCase();
    links=links.filter(l=>(l.title||'').toLowerCase().includes(kw)||(l.url||'').toLowerCase().includes(kw));
  }
  const catsBar=document.createElement('div');
  catsBar.className='link-cats-bar';
  const allChip=document.createElement('div');
  allChip.className='cat-chip'+(currentLinkCatFilter==='__all__'?' active':'');
  allChip.innerHTML=`📚 全部 <span class="cat-count">${links.length}</span>`;
  allChip.onclick=()=>{currentLinkCatFilter='__all__';render();};
  catsBar.appendChild(allChip);
  cats.forEach(cat=>{
    const count=links.filter(l=>l.categoryId===cat.id).length;
    const isDefault=cat.id===DEFAULT_CAT_ID;
    const chip=document.createElement('div');
    chip.className='cat-chip'+(currentLinkCatFilter===cat.id?' active':'');
    chip.innerHTML=`<span>${esc(cat.name)}</span><span class="cat-count">${count}</span>
      ${!isDefault?`<button class="cat-del-btn" data-cat-id="${cat.id}" title="删除分类">×</button>`:''}`;
    chip.onclick=e=>{
      if(e.target.dataset.catId){e.stopPropagation();deleteLinkCategory(e.target.dataset.catId);return;}
      currentLinkCatFilter=cat.id;render();
    };
    catsBar.appendChild(chip);
  });
  const addCatBtn=document.createElement('button');
  addCatBtn.className='cat-add-btn';addCatBtn.textContent='+ 新建分类';
  addCatBtn.onclick=()=>openLinkCatModal('create');
  catsBar.appendChild(addCatBtn);
  wrap.appendChild(catsBar);

  const catsToShow=currentLinkCatFilter==='__all__'?cats:cats.filter(c=>c.id===currentLinkCatFilter);
  let totalVisible=0;
  catsToShow.forEach(cat=>{totalVisible+=links.filter(l=>l.categoryId===cat.id).length;});
  if(totalVisible===0){
    const empty=document.createElement('div');
    empty.className='links-empty';
    empty.innerHTML=`<div class="big">🔗</div>
      <div>${filter.keyword?'没有匹配的网址':'这个分类下还没有网址'}</div>
      ${filter.keyword?'':'<div style="margin-top:8px;">点击右上角 ＋ 添加一个</div>'}`;
    wrap.appendChild(empty);return;
  }
  catsToShow.forEach(cat=>{
    const catLinks=links.filter(l=>l.categoryId===cat.id);
    if(!catLinks.length&&currentLinkCatFilter==='__all__')return;
    const isDefault=cat.id===DEFAULT_CAT_ID;
    const groupEl=document.createElement('div');
    groupEl.className='link-group';
    groupEl.innerHTML=`
      <div class="link-group-header">
        <span class="link-group-title">${esc(cat.name)}</span>
        <span class="link-group-count">${catLinks.length}</span>
        <div class="link-group-actions">
          <button class="link-btn" data-act="rename-cat" data-cat-id="${cat.id}" title="重命名">✎</button>
          ${!isDefault?`<button class="link-btn danger" data-act="del-cat" data-cat-id="${cat.id}" title="删除分类">🗑</button>`:''}
        </div>
      </div>
      <div class="links-grid">
        ${catLinks.map(l=>linkCardHTML(l)).join('')||'<div style="grid-column:1/-1;color:var(--muted);font-size:12px;padding:8px 4px;">此分类下暂无网址</div>'}
      </div>`;
    wrap.appendChild(groupEl);
  });
  wrap.querySelectorAll('[data-act="rename-cat"]').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();openLinkCatModal('edit',btn.dataset.catId);};
  });
  wrap.querySelectorAll('[data-act="del-cat"]').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();deleteLinkCategory(btn.dataset.catId);};
  });
  wrap.querySelectorAll('.link-card').forEach(card=>{
    card.onclick=e=>{
      const id=card.dataset.linkId;
      const act=e.target.dataset.act;
      if(act==='edit-link'){e.stopPropagation();openLinkModal('edit',id);return;}
      if(act==='del-link'){e.stopPropagation();deleteLink(id);return;}
      if(act==='move-link-up'){e.stopPropagation();moveLink(id,'up');return;}
      if(act==='move-link-down'){e.stopPropagation();moveLink(id,'down');return;}
      const link=state.links.find(l=>l.id===id);
      if(link&&link.url){
        let url=link.url.trim();
        if(!/^https?:\/\//i.test(url))url='https://'+url;
        window.open(url,'_blank','noopener');
      }
    };
  });
}
function linkCardHTML(l){
  return `
    <div class="link-card" data-link-id="${l.id}">
      <div class="link-icon" style="background:${l.color||'#A2B0A0'}">${esc((l.title||'?').charAt(0).toUpperCase())}</div>
      <div class="link-info">
        <div class="link-title">${esc(l.title)}</div>
        <div class="link-url">${esc(l.url)}</div>
      </div>
      <div class="link-actions">
        <button class="link-btn" data-act="move-link-up" data-link-id="${l.id}" title="上移">↑</button>
        <button class="link-btn" data-act="move-link-down" data-link-id="${l.id}" title="下移">↓</button>
        <button class="link-btn" data-act="edit-link" data-link-id="${l.id}" title="编辑">✎</button>
        <button class="link-btn danger" data-act="del-link" data-link-id="${l.id}" title="删除">🗑</button>
      </div>
    </div>`;
}
function deleteLink(linkId){
  const link=state.links.find(l=>l.id===linkId);if(!link)return;
  if(!confirm(`确定删除「${link.title}」？`))return;
  state.links=state.links.filter(l=>l.id!==linkId);
  save();render();
}
function moveLink(linkId,direction){
  const link=state.links.find(l=>l.id===linkId);if(!link)return;
  const sameCatLinks=state.links.filter(l=>l.categoryId===link.categoryId);
  const curIdxInCat=sameCatLinks.findIndex(l=>l.id===linkId);
  const targetIdxInCat=direction==='up'?curIdxInCat-1:curIdxInCat+1;
  if(targetIdxInCat<0||targetIdxInCat>=sameCatLinks.length)return;
  const targetLink=sameCatLinks[targetIdxInCat];
  const i1=state.links.indexOf(link);
  const i2=state.links.indexOf(targetLink);
  [state.links[i1],state.links[i2]]=[state.links[i2],state.links[i1]];
  save();render();
}
function deleteLinkCategory(catId){
  const cat=getLinkCat(catId);if(!cat)return;
  if(catId===DEFAULT_CAT_ID){alert('"未分类"不能删除');return;}
  const catLinks=state.links.filter(l=>l.categoryId===catId);
  const msg=catLinks.length
    ?`确定删除分类「${cat.name}」？\n\n其下的 ${catLinks.length} 个网址会被移动到「未分类」。`
    :`确定删除分类「${cat.name}」？`;
  if(!confirm(msg))return;
  state.links.forEach(l=>{if(l.categoryId===catId)l.categoryId=DEFAULT_CAT_ID;});
  state.linkCategories=state.linkCategories.filter(c=>c.id!==catId);
  if(currentLinkCatFilter===catId)currentLinkCatFilter='__all__';
  save();render();
}

function render(){

  const views={board:'board-view',today:'today-view',notes:'notes-view',review:'review-view',feedback:'feedback-view',links:'links-view',about:'about-view'};
  Object.values(tools).forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
  Object.values(views).forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});

  const search=document.getElementById('search-input');

  if(currentSection==='today'){
    document.getElementById('today-tools').style.display='flex';
    document.getElementById('today-view').style.display='flex';
    search.style.display='none';renderToday();return;
  }
  if(currentSection==='notes'){
    document.getElementById('notes-tools').style.display='flex';
    document.getElementById('notes-view').style.display='flex';
    search.style.display='block';search.placeholder='搜索随笔…';
    renderNotes();return;
  }
  if(currentSection==='review'){
    search.style.display='none';
    document.getElementById('review-view').style.display='flex';
    refreshReviewWeekSelect();renderReview();return;
  }
  if(currentSection==='feedback'){
    document.getElementById('feedback-tools').style.display='flex';
    document.getElementById('feedback-view').style.display='flex';
    search.style.display='none';
    renderFeedback();return;
  }
  if(currentSection==='links'){
    document.getElementById('links-tools').style.display='flex';
    document.getElementById('links-view').style.display='flex';
    search.style.display='block';search.placeholder='搜索网址…';
    renderLinks();return;
  }
  if(currentSection==='about'){
    search.style.display='none';
    document.getElementById('about-view').style.display='flex';
    renderAbout();return;
  }

  runArchiveCheck();
  document.getElementById('board-tools').style.display='flex';
  document.getElementById('board-view').style.display='flex';
  search.style.display='block';search.placeholder='搜索全部任务…';

  const header=document.getElementById('board-header');

  const isSearching=filter.keyword.length>0;

  if(viewMode==='list'){
    header.style.display='none';
    wrap.className='list-wrap';
    renderList();
  }else{

    const weekNav=document.getElementById('week-nav');

      const sel=document.getElementById('week-select');

    }else{
      weekNav.classList.remove('searching');
      const sel=document.getElementById('week-select');
      sel.disabled=false;refreshWeekSelect();
    }
    renderBoard();
  }
}

  const col=getCol(taskModalState.colId);if(!col){closeTaskModal();return;}

  }else{
    const card=col.cards.find(c=>c.id===taskModalState.cardId);
    if(card){
      const oldRemind=card.remindAt;
      card.title=title;card.priority=taskModalState.priority;
      card.status=taskModalState.status;card.weekStart=weekStart;
      card.updatedAt=Date.now();card.isToday=taskModalState.isToday;
      card.remindAt=isDoneCol?null:remindAt;
      if(oldRemind!==card.remindAt)shownReminders.delete(card.id);
      if(isDoneCol&&!card.completedAt)card.completedAt=Date.now();
      if(!isDoneCol&&card.completedAt){card.completedAt=null;card.archived=false;}
    }
  }
  save();render();closeTaskModal();
}
function deleteCardFromModal(){
  if(taskModalState.mode!=='edit')return;
  if(!confirm('确定删除该任务？'))return;
  const col=getCol(taskModalState.colId);
  if(col){col.cards=col.cards.filter(c=>c.id!==taskModalState.cardId);save();render();}

}

      picker.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));

function renderArchiveList(){
  const list=document.getElementById('archive-list');
  const archived=getArchivedCards();
  if(!archived.length){list.innerHTML=`<div class="archive-empty">暂无归档任务</div>`;return;}
  list.innerHTML=archived.map(c=>`
    <div class="archive-item">
      <span class="a-dot" style="background:${c.__colColor}"></span>
      <div class="a-body">
        <div class="a-title"><span style="color:var(--muted);font-size:11px;margin-right:6px;">#${c.number||''}</span>${esc(c.title)}</div>
        <div class="a-meta"><span>${esc(c.__colTitle)}</span><span class="done-date">完成于 ${formatDateCN(c.completedAt)}</span></div>
      </div>
      <div class="a-actions">
        <button class="a-btn" data-act="restore" data-card-id="${c.id}" data-col-id="${c.__colId}">恢复</button>
        <button class="a-btn danger" data-act="delete" data-card-id="${c.id}" data-col-id="${c.__colId}">删除</button>
      </div>
    </div>`).join('');

      const col=getCol(btn.dataset.colId);if(!col)return;
      col.cards=col.cards.filter(c=>c.id!==btn.dataset.cardId);
      save();render();renderArchiveList();
    };
  });
}

/* ========== 看板事件绑定 ========== */
let justDragged=false;
function bindBoardEvents(){
  document.querySelectorAll('[data-act="add-card"]').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();openTaskModal('create',btn.dataset.colId);};
  });
  document.querySelectorAll('[data-act="edit-col"]').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();openColModal('edit',btn.dataset.colId);};
  });
  document.querySelectorAll('[data-act="del-col"]').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();deleteColumn(btn.dataset.colId);};
  });

  document.querySelectorAll('.card-desc-input').forEach(ta=>{
    ta.addEventListener('click',e=>e.stopPropagation());
    ta.addEventListener('mousedown',e=>e.stopPropagation());
    ta.addEventListener('dragstart',e=>e.stopPropagation());
    ta.addEventListener('input',()=>{
      const cardId=ta.dataset.descCardId,colId=ta.dataset.descColId;
      const col=getCol(colId);if(!col)return;
      const card=col.cards.find(c=>c.id===cardId);if(!card)return;
      card.description=ta.value;card.updatedAt=Date.now();
      debouncedSave();
    });
  });

  let dragCardId=null,dragFromColId=null;
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragCardId=card.dataset.cardId;dragFromColId=card.dataset.colId;
      justDragged=true;card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      document.querySelectorAll('.column-body').forEach(el=>el.classList.remove('drag-over'));
      setTimeout(()=>{justDragged=false;},80);
    });
    card.addEventListener('click',e=>{
      if(justDragged)return;
      const colId=card.dataset.colId,cardId=card.dataset.cardId;
      const act=e.target.dataset.act;
      if(act==='toggle-desc'){
        e.stopPropagation();
        if(expandedCards.has(cardId))expandedCards.delete(cardId);
        else expandedCards.add(cardId);
        render();
        if(expandedCards.has(cardId))
          setTimeout(()=>{const ta=document.querySelector(`.card-desc-input[data-desc-card-id="${cardId}"]`);if(ta)ta.focus();},50);
        return;
      }
      if(act==='move-up'){e.stopPropagation();moveCard(cardId,colId,'up');return;}
      if(act==='move-down'){e.stopPropagation();moveCard(cardId,colId,'down');return;}
      if(act==='del-card'){
        e.stopPropagation();
        const col=getCol(colId);
        if(col&&confirm('确定删除该任务？')){
          col.cards=col.cards.filter(c=>c.id!==cardId);
          expandedCards.delete(cardId);save();render();
        }
        return;
      }
      if(act==='toggle-today'){
        e.stopPropagation();
        const col=getCol(colId),cardO=col&&col.cards.find(c=>c.id===cardId);
        if(!cardO)return;
        if(col.group==='done'){alert('已完成的任务不需要标记今日');return;}
        cardO.isToday=!cardO.isToday;save();render();
        return;
      }
      if(act==='toggle-status'){
        e.stopPropagation();
        const col=getCol(colId),cardO=col&&col.cards.find(c=>c.id===cardId);
        if(!cardO)return;
        cardO.status=STATUS_CYCLE[cardO.status||'']||'';
        cardO.updatedAt=Date.now();save();render();
        return;
      }
      if(e.target.classList.contains('card-desc-input'))return;
      openTaskModal('edit',colId,cardId);
    });
  });
  document.querySelectorAll('.column-body').forEach(body=>{
    body.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      body.classList.add('drag-over');
    });
    body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
    body.addEventListener('drop',e=>{
      e.preventDefault();body.classList.remove('drag-over');
      const toColId=body.dataset.colId;
      if(!dragCardId||!dragFromColId||toColId===dragFromColId)return;
      const fromCol=getCol(dragFromColId),toCol=getCol(toColId);
      if(!fromCol||!toCol)return;
      const idx=fromCol.cards.findIndex(c=>c.id===dragCardId);
      if(idx===-1)return;
      const [card]=fromCol.cards.splice(idx,1);
      if(toCol.group==='done'){
        if(!card.completedAt)card.completedAt=Date.now();
        card.archived=false;card.isToday=false;card.remindAt=null;
      }else{card.completedAt=null;card.archived=false;}
      card.updatedAt=Date.now();
      toCol.cards.push(card);save();render();
      dragCardId=null;dragFromColId=null;
    });
  });
}

/* ========== 提醒系统 ========== */
function checkReminders(){
  const now=Date.now();
  state.columns.forEach(col=>{
    if(col.group==='done')return;
    col.cards.forEach(card=>{
      if(card.archived||!card.remindAt)return;
      if(card.remindAt>now)return;
      if(shownReminders.has(card.id))return;
      shownReminders.add(card.id);
      pushReminderToStack(card,col);
    });
  });
}
function pushReminderToStack(card,col){
  const stack=document.getElementById('reminder-stack');if(!stack)return;
  const el=document.createElement('div');
  el.className='reminder-item';
  el.dataset.cardId=card.id;el.dataset.colId=col.id;
  el.innerHTML=`
    <button class="reminder-close" title="关闭">×</button>
    <div class="reminder-icon">⏰</div>
    <div class="reminder-body">
      <div class="reminder-title">
        <span class="reminder-num">#${card.number||''}</span>${esc(card.title)}
      </div>
      <div class="reminder-text">肖先生，该事项即将截止，请留意</div>
      <div class="reminder-time">🕒 提醒时间 ${formatDateTimeCN(card.remindAt)}</div>
    </div>`;
  el.querySelector('.reminder-close').onclick=e=>{e.stopPropagation();removeReminder(el);};
  el.onclick=e=>{
    if(e.target.classList.contains('reminder-close'))return;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    const boardBtn=document.querySelector('.nav-item[data-nav="board"]');
    if(boardBtn)boardBtn.classList.add('active');
    currentSection='board';viewMode='board';
    currentWeekOffset=weekStartToOffset(card.weekStart);
    render();
    setTimeout(()=>openTaskModal('edit',col.id,card.id),100);
    removeReminder(el);
  };
  stack.appendChild(el);
}
function removeReminder(el){
  el.classList.add('removing');
  setTimeout(()=>el.remove(),250);
}
